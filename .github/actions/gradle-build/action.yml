# =============================================================================
# gradle-build
#
# Runs compile -> test -> check -> assemble as four independently red/green
# steps sharing one workspace and one Gradle daemon, so each finds the
# previous step's work UP-TO-DATE via <project>/.gradle.
#
# Callers MUST run actions/checkout and the setup-java-gradle action first:
# this action only invokes ./gradlew, it installs nothing.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: gradle-build
description: >-
  Runs the compile / test / check / assemble phases as four red/green steps.

inputs:
  # settings.gradle.kts reads GITHUB_USER and GITHUB_TOKEN while EVALUATING
  # SETTINGS, to resolve "com.rubensgomes:gradle-catalog" from GitHub Packages.
  # Every ./gradlew call needs both; without them, an HTTP 401.
  #
  # They are inputs because a composite action cannot read "secrets", and they
  # are named PACKAGES_* because Actions reserves the "GITHUB_" prefix in
  # "env:". Each step exports the real names itself, which also keeps the token
  # off the command line. "required: true" is documentation -- the runner does
  # not enforce it here.
  packages-user:
    description: >-
      GitHub Packages username, exported to the build as GITHUB_USER.
    required: true
  packages-token:
    description: 'GitHub Packages token, exported to the build as GITHUB_TOKEN.'
    required: true

  # Overrides the noisier settings in gradle.properties (console=verbose,
  # logging.level=info), and disables foojay auto-provisioning so a toolchain
  # mismatch fails in seconds instead of downloading a second ~200 MB JDK.
  gradle-args:
    description: >-
      Flags passed to every ./gradlew invocation. Word-split by bash, so
      unquoted.
    required: false
    default: >-
      --console=plain
      -Dorg.gradle.logging.level=lifecycle
      -Porg.gradle.java.installations.auto-download=false

  # The Gradle project path to build, WITHOUT a trailing colon. Every task
  # below is derived from it, so a single-project build passes "" and a
  # differently named subproject passes e.g. ":service". The default matches
  # the layout every rubensgomes-org Spring Boot repo inherits from
  # spring-blueprint.
  project-path:
    description: >-
      Gradle project path to build, without a trailing colon (e.g. ":app").
    required: false
    default: ':app'

runs:
  using: composite
  steps:
    # Each step echoes its command so the phase is greppable in raw logs.
    #
    # "shell: bash" is required on composite run steps, and load-bearing:
    # $GRADLE_ARGS is expanded unquoted and needs bash word-splitting.
    #
    # No "--no-daemon": one daemon serves every step, and setup-gradle stops it
    # post-job. Env is set per step rather than inherited from the caller's job.

    - name: compile
      shell: bash
      env:
        PACKAGES_USER: ${{ inputs.packages-user }}
        PACKAGES_TOKEN: ${{ inputs.packages-token }}
        GRADLE_ARGS: ${{ inputs.gradle-args }}
        PROJECT_PATH: ${{ inputs.project-path }}
      run: |
        echo "=============================================================="
        echo " STEP: compile"
        echo " ./gradlew ${PROJECT_PATH}:classes ${PROJECT_PATH}:testClasses"
        echo "=============================================================="
        export GITHUB_USER="$PACKAGES_USER"
        export GITHUB_TOKEN="$PACKAGES_TOKEN"
        # $GRADLE_ARGS is intentionally unquoted: bash word-splitting is how
        # the flags become separate arguments.
        # shellcheck disable=SC2086
        ./gradlew $GRADLE_ARGS "${PROJECT_PATH}:classes" \
          "${PROJECT_PATH}:testClasses"
        # "classes", not "compileJava", so processResources runs here -- that is
        # where ReplaceTokens substitutes @artifactId@ into application.yml.
        # "testClasses" too: a broken test is a COMPILE failure, and belongs to
        # this step rather than surfacing as a confusing test failure later.

    - name: test
      shell: bash
      env:
        PACKAGES_USER: ${{ inputs.packages-user }}
        PACKAGES_TOKEN: ${{ inputs.packages-token }}
        GRADLE_ARGS: ${{ inputs.gradle-args }}
        PROJECT_PATH: ${{ inputs.project-path }}
      run: |
        echo "=============================================================="
        echo " STEP: test"
        echo " ./gradlew ${PROJECT_PATH}:test"
        echo "=============================================================="
        export GITHUB_USER="$PACKAGES_USER"
        export GITHUB_TOKEN="$PACKAGES_TOKEN"
        # shellcheck disable=SC2086
        ./gradlew $GRADLE_ARGS "${PROJECT_PATH}:test"
        # "test" is finalizedBy jacocoTestReport, so the XML report the coverage
        # gate and SonarCloud consume is produced here -- even when tests fail.

    - name: check
      shell: bash
      env:
        PACKAGES_USER: ${{ inputs.packages-user }}
        PACKAGES_TOKEN: ${{ inputs.packages-token }}
        GRADLE_ARGS: ${{ inputs.gradle-args }}
        PROJECT_PATH: ${{ inputs.project-path }}
      run: |
        echo "=============================================================="
        echo " STEP: check"
        echo " ./gradlew ${PROJECT_PATH}:check"
        echo "=============================================================="
        export GITHUB_USER="$PACKAGES_USER"
        export GITHUB_TOKEN="$PACKAGES_TOKEN"
        # shellcheck disable=SC2086
        ./gradlew $GRADLE_ARGS "${PROJECT_PATH}:check"
        # Adds spotlessCheck, jacocoTestCoverageVerification (90% LINE and 90%
        # BRANCH) and spotbugsMain. The SpotBugs tasks are attached to "check"
        # by the com.github.spotbugs plugin itself, not by the consumer's build
        # script, which is why SpotBugs gates here and has no step of its own.
        # "test" is not re-run: nothing here mutates its inputs, and compileJava
        # does not depend on spotlessApply.

    - name: assemble
      shell: bash
      env:
        PACKAGES_USER: ${{ inputs.packages-user }}
        PACKAGES_TOKEN: ${{ inputs.packages-token }}
        GRADLE_ARGS: ${{ inputs.gradle-args }}
        PROJECT_PATH: ${{ inputs.project-path }}
      run: |
        echo "=============================================================="
        echo " STEP: assemble"
        echo " ./gradlew ${PROJECT_PATH}:build"
        echo "=============================================================="
        export GITHUB_USER="$PACKAGES_USER"
        export GITHUB_TOKEN="$PACKAGES_TOKEN"
        # shellcheck disable=SC2086
        ./gradlew $GRADLE_ARGS "${PROJECT_PATH}:build"
        # "${PROJECT_PATH}:build" is assemble + check, and check is
        # UP-TO-DATE from the previous step. New work: bootJar,
        # applicationJar (the "-spring-boot.jar" copy the Dockerfile
        # expects) and generateDotEnv.
