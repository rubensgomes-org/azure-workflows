# =============================================================================
# poetry-build
#
# Runs the static type checker, static code analysis, a dependency
# vulnerability scan, and unit test coverage as four independently red/green
# steps. Callers MUST list `pip-audit` in their Poetry dev dependencies.
#
# Callers MUST run actions/checkout and the setup-python-poetry action first:
# this action only invokes `poetry run ...`, it installs nothing.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: poetry-build
description: >-
  Runs the static type checker, static code analysis, a dependency
  vulnerability scan, and unit test coverage.

runs:
  using: composite
  steps:
    - name: Static type checker
      shell: bash
      run: |
        echo "=============================================================="
        echo " STEP: Static type checker"
        echo "=============================================================="
        poetry run mypy src/

    - name: Static code analysis
      shell: bash
      run: |
        echo "=============================================================="
        echo " STEP: Static code analysis"
        echo "=============================================================="
        poetry run pylint src/ tests/

    # --strict is not used: it fails on the skipped editable project itself.
    - name: Dependency vulnerability scan
      shell: bash
      run: |
        echo "=============================================================="
        echo " STEP: Dependency vulnerability scan"
        echo "=============================================================="
        poetry run pip-audit --skip-editable

    - name: Unit test coverage
      shell: bash
      run: |
        echo "=============================================================="
        echo " STEP: Unit test coverage"
        echo "=============================================================="
        poetry run pytest --cov=src/
