# =============================================================================
# setup-java-gradle
#
# Installs the pinned JDK and configures Gradle. Nothing else: no checkout,
# no build. Pair it with the gradle-build action, or with a direct ./gradlew
# call.
#
# Callers MUST run actions/checkout first -- setup-gradle reads
# gradle/wrapper/gradle-wrapper.properties out of the checked-out workspace.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: setup-java-gradle
description: 'Installs the pinned JDK and configures Gradle.'

inputs:
  # MUST match the toolchain pinned in the CONSUMER's build.gradle.kts:
  #   languageVersion = 25, vendor = JvmVendorSpec.MICROSOFT
  # The runners' preinstalled Temurin does not satisfy it. These two defaults
  # and that toolchain block are one pin in two places; they move together.
  java-version:
    description: >-
      Java language version to install. Must match the build toolchain pin.
    required: false
    default: '25'   # quoted so YAML cannot read a future "25.0" as a float
  java-distribution:
    description: >-
      JDK distribution to install. Must match the build toolchain vendor pin.
    required: false
    default: microsoft

runs:
  using: composite
  steps:
    # Must precede setup-gradle: it sets JAVA_HOME, which is both the JVM
    # running the daemon and a toolchain candidate Gradle discovers.
    - name: >-
        Set up Java (${{ inputs.java-distribution }}
        ${{ inputs.java-version }})
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        # No "cache: gradle" -- setup-gradle owns the Gradle User Home cache.

    # Validates the committed gradle-wrapper.jar checksum by default, so a
    # separate wrapper-validation action is redundant.
    #
    # NOTE: never add --write-locks. Locking is LockMode.STRICT against three
    # committed lock files; CI must FAIL on drift, not paper over it.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
