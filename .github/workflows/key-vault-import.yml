# =============================================================================
# key-vault-import
#
# Reusable workflow: set every secret in the secrets-json secret, a JSON
# object of secret names to values, in an EXISTING Azure Key Vault. Values
# are never printed.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: Azure Key Vault Import (reusable)

on:
  workflow_call:
    inputs:
      vault-name:
        description: 'Name of the EXISTING Azure Key Vault.'
        required: true
        type: string
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        default: 15
        type: number
      azure-client-id:
        description: 'Service principal application (client) ID.'
        required: true
        type: string
      azure-tenant-id:
        description: 'Entra ID tenant ID.'
        required: true
        type: string
      azure-subscription-id:
        description: 'Subscription holding the Key Vault.'
        required: true
        type: string

    secrets:
      secrets-json:
        description: 'JSON object mapping secret names to string values.'
        required: true
      azure-client-secret:
        description: 'Service principal client secret.'
        required: true

jobs:
  import:
    name: import
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    env:
      VAULT_NAME: ${{ inputs.vault-name }}

    steps:
      # Key Vault secret names allow only alphanumerics and dashes.
      - name: Validate the inputs
        shell: bash
        env:
          SECRETS_JSON: ${{ secrets.secrets-json }}
        run: |
          echo "=============================================================="
          echo " STEP: Validate the inputs"
          echo "=============================================================="
          set -euo pipefail
          if ! jq -e 'type == "object" and length > 0
                      and all(.[]; type == "string")' \
                 <<< "$SECRETS_JSON" > /dev/null 2>&1; then
            echo "secrets-json must be a non-empty JSON object whose" \
                 "values are strings." >&2
            exit 1
          fi
          invalid="$(jq -r 'keys[]
                            | select(test("^[0-9a-zA-Z-]{1,127}$") | not)' \
                       <<< "$SECRETS_JSON")"
          if [ -n "$invalid" ]; then
            echo "Invalid Key Vault secret names:" >&2
            # shellcheck disable=SC2001
            echo "$invalid" | sed 's/^/  /' >&2
            exit 1
          fi
          echo "Importing $(jq length <<< "$SECRETS_JSON") secrets" \
               "into ${VAULT_NAME}"

      - name: Sign in to Azure
        uses: rubensgomes-org/azure-workflows/.github/actions/azure-login@v0
        with:
          client-id: ${{ inputs.azure-client-id }}
          client-secret: ${{ secrets.azure-client-secret }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      # Each value goes through a 0600 temp file rather than --value, so it
      # never appears in a process argument list and keeps any trailing
      # newline.
      - name: Import the secrets
        shell: bash
        env:
          SECRETS_JSON: ${{ secrets.secrets-json }}
        run: |
          echo "=============================================================="
          echo " STEP: Import the secrets"
          echo " az keyvault secret set --vault-name ${VAULT_NAME}"
          echo "=============================================================="
          set -euo pipefail
          value_file="$(mktemp "${RUNNER_TEMP}/kv-secret.XXXXXX")"
          trap 'rm -f "$value_file"' EXIT
          while IFS= read -r secret_name; do
            echo "Setting secret: ${secret_name}"
            jq -j --arg name "$secret_name" '.[$name]' \
              <<< "$SECRETS_JSON" > "$value_file"
            az keyvault secret set \
              --vault-name "$VAULT_NAME" \
              --name "$secret_name" \
              --file "$value_file" \
              --encoding utf-8 \
              --output none
          done < <(jq -r 'keys[]' <<< "$SECRETS_JSON")

      - name: Verify the imported secrets
        shell: bash
        env:
          SECRETS_JSON: ${{ secrets.secrets-json }}
        run: |
          echo "=============================================================="
          echo " STEP: Verify the imported secrets"
          echo " az keyvault secret show --vault-name ${VAULT_NAME}"
          echo "=============================================================="
          set -euo pipefail
          while IFS= read -r secret_name; do
            updated="$(az keyvault secret show \
                         --vault-name "$VAULT_NAME" \
                         --name "$secret_name" \
                         --query attributes.updated \
                         --output tsv)"
            echo "  ${secret_name}  updated ${updated}"
          done < <(jq -r 'keys[]' <<< "$SECRETS_JSON")
