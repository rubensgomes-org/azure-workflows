# =============================================================================
# poetry-publish-pypi
#
# Reusable workflow: resolves the version from pyproject.toml, renames the
# CHANGELOG.md [Unreleased] section to that version, builds the package with
# Poetry and publishes it to PyPI. The release notes are uploaded as the
# "release-notes" artifact; version and tag are exposed as outputs.
#
# WRITES TO THE REPOSITORY. The CHANGELOG.md rename is committed and pushed
# to the calling branch, so the caller must grant
# "permissions: contents: write".
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: Publish to PyPI (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python language version. Must match the consumer pin.'
        required: false
        default: '3.14'
        type: string
      poetry-version:
        description: 'Poetry version. Must match the consumer pin.'
        required: false
        default: '2.4.3'
        type: string
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        default: 15
        type: number

    secrets:
      pypi-token:
        description: 'PyPI API token used by "poetry publish".'
        required: true

    outputs:
      version:
        description: 'Released version, e.g. 1.2.3.'
        value: ${{ jobs.publish.outputs.version }}
      tag:
        description: 'Release tag, e.g. v1.2.3. Not created by this workflow.'
        value: ${{ jobs.publish.outputs.tag }}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      # Checks out the CALLING repository. Full history brings every tag
      # along, which the "already released" check below relies on.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the version and tag
        id: resolve
        shell: bash
        run: |
          echo "=============================================================="
          echo " STEP: Resolve the version and tag"
          echo "=============================================================="
          set -euo pipefail

          file='pyproject.toml'
          raw="$(sed -n 's/^version = "\(.*\)"$/\1/p' "${file}" | head -n1)"

          if [ -z "${raw}" ]; then
            echo "::error::No 'version = \"...\"' found in ${file}."
            exit 1
          fi

          version="${raw}"
          tag="v${version}"

          if ! printf '%s' "${tag}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'${tag}' is not vMAJOR.MINOR.PATCH."
            exit 1
          fi

          # PyPI rejects re-uploading a filename it has already seen, so a
          # stale pyproject.toml version must fail here, not deep inside
          # 'poetry publish'.
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "::error::Tag '${tag}' already exists -- ${version} was" \
                 "already released."
            echo "Bump the version in pyproject.toml, then re-run." >&2
            exit 1
          fi

          echo "Version : ${version}"
          echo "Tag     : ${tag}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"         >> "$GITHUB_OUTPUT"

      - name: Rename [Unreleased] to the release version
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "=============================================================="
          echo " STEP: Rename [Unreleased] to the release version"
          echo "=============================================================="
          set -euo pipefail

          if grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md already has a '## [${VERSION}]' section;" \
                 "leaving it as-is."
            exit 0
          fi

          unreleased="$(awk '
            $0 == "## [Unreleased]" { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md)"

          if ! printf '%s\n' "${unreleased}" \
              | grep -qE '^[[:space:]]*[^[:space:]#]'; then
            echo "::error::CHANGELOG.md's '[Unreleased]' section is empty --" \
                 "nothing to rename."
            echo "Write what changed under it, commit, then re-run." >&2
            exit 1
          fi

          release_date="$(date -u +%Y-%m-%d)"

          awk -v ver="${VERSION}" -v rdate="${release_date}" '
            $0 == "## [Unreleased]" {
              print "## [Unreleased]"
              print ""
              print "### Added"
              print ""
              print "### Changed"
              print ""
              print "### Fixed"
              print ""
              print "## [" ver "] - " rdate
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          git commit -m "docs: release ${VERSION} changelog section"
          git push origin "HEAD:${BRANCH}"

      - name: Verify the CHANGELOG section exists and is not empty
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          echo "=============================================================="
          echo " STEP: Verify the CHANGELOG section exists and is not empty"
          echo "=============================================================="
          set -euo pipefail

          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section."
            echo "Rename [Unreleased] to ${VERSION}, add a fresh empty" >&2
            echo "[Unreleased] above it, commit to main, then re-run." >&2
            exit 1
          fi

          content="$(awk -v ver="${VERSION}" '
            $0 == "## [" ver "]" ||
              index($0, "## [" ver "] ") == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md)"

          pattern='^[[:space:]]*[^[:space:]#]'
          if ! printf '%s\n' "${content}" | grep -qE "${pattern}"; then
            echo "::error::The '## [${VERSION}]' section has no content --" \
                 "only blank lines and empty sub-headings."
            echo "Write what changed under it, commit, then re-run." >&2
            exit 1
          fi

      - name: Build release notes from CHANGELOG
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          echo "=============================================================="
          echo " STEP: Build release notes from CHANGELOG"
          echo "=============================================================="
          set -euo pipefail

          awk -v ver="${VERSION}" '
            $0 == "## [" ver "]" ||
              index($0, "## [" ver "] ") == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md

          echo "----- release notes -----"
          cat release-notes.md

      - name: Upload the release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

      - name: Set up Python and Poetry
        uses: rubensgomes-org/azure-workflows/.github/actions/setup-python-poetry@v0
        with:
          python-version: ${{ inputs.python-version }}
          poetry-version: ${{ inputs.poetry-version }}

      - name: Build the package
        shell: bash
        run: |
          echo "=============================================================="
          echo " STEP: Build the package"
          echo "=============================================================="
          set -euo pipefail

          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(date +%s)"
          poetry build -v

      - name: Configure Poetry pypi-token
        shell: bash
        env:
          PYPI_API_TOKEN: ${{ secrets.pypi-token }}
        run: |
          echo "=============================================================="
          echo " STEP: Configure Poetry pypi-token"
          echo "=============================================================="
          set -euo pipefail

          poetry config pypi-token.pypi "$PYPI_API_TOKEN"

      - name: Publish PyPI Release
        shell: bash
        run: |
          echo "=============================================================="
          echo " STEP: Publish PyPI Release"
          echo "=============================================================="
          set -euo pipefail

          poetry publish -v
