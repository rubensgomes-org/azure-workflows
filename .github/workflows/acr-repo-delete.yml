# =============================================================================
# acr-repo-delete
#
# Reusable workflow: DESTRUCTIVE. Deletes an entire repository -- every tag
# and every manifest -- from an Azure Container Registry. There is no
# soft-delete and no recycle bin.
#
# The actor must be one of the logins in the allowed-actor input. This
# safeguard runs BEFORE any Azure credential is touched, and the sign-in step
# must stay after it. If the safeguard fails, nothing was deleted and Azure
# was never contacted, and the log must be able to say so.
#
# Deleting is idempotent: a repository that is already absent, or a registry
# that is already absent, is the state the caller asked for, so the run
# reports what it found and succeeds. Only a failure to ASK Azure -- a
# network, token or permission problem -- fails the run.
#
# NOTE: acr-destroy.yml in rubensgomes-org/azure-iac destroys the
# registry itself. This one only empties a repository inside a registry that
# stays.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: acr-repo-delete

on:
  workflow_call:
    inputs:
      environment:
        description: >-
          Image namespace. With artifactId this forms the repository
          <environment>/<artifactId>.
        required: true
        type: string
      registry-name:
        description: >-
          Name of the EXISTING Azure Container Registry to delete from (not the
          login server).
        required: true
        type: string
      artifact-id:
        description: >-
          Artifact ID. With environment this forms the repository
          <environment>/<artifact-id>.
        required: true
        type: string
      allowed-actor:
        description: >
          GitHub logins permitted to run this workflow, separated by commas or
          spaces. Still singular so that callers already passing one login keep
          working.
        required: false
        default: 'rubensgomes,rubens-gomes_3CC'
        type: string
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        default: 15
        type: number
      azure-client-id:
        description: 'Service principal application (client) ID.'
        required: true
        type: string
      azure-tenant-id:
        description: 'Entra ID tenant ID.'
        required: true
        type: string
      azure-subscription-id:
        description: 'Subscription holding the registry.'
        required: true
        type: string

    secrets:
      azure-client-secret:
        description: 'Service principal client secret.'
        required: true

jobs:
  delete:
    name: delete
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    env:
      ACR_NAME: ${{ inputs.registry-name }}
      ENVIRONMENT: ${{ inputs.environment }}
      ALLOWED_ACTOR: ${{ inputs.allowed-actor }}

    steps:
      - name: Resolve the repository coordinates
        id: repo
        shell: bash
        env:
          ARTIFACT_ID: ${{ inputs.artifact-id }}
        run: |
          echo "=============================================================="
          echo " STEP: Resolve the repository coordinates"
          echo "=============================================================="
          set -euo pipefail
          if [ -z "${ENVIRONMENT:-}" ]; then
            echo "The environment input resolved to empty." >&2
            exit 1
          fi
          echo "repository=${ENVIRONMENT}/${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
          echo "Target repository: ${ENVIRONMENT}/${ARTIFACT_ID}"

      # MUST stay ahead of the sign-in step. github.actor is the actor of the
      # CALLER's run, which is the human who pressed "Run workflow".
      - name: SAFEGUARD - Validate actor
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ steps.repo.outputs.repository }}
        run: |
          echo "=============================================================="
          echo " STEP: SAFEGUARD - Validate actor"
          echo "=============================================================="
          set -euo pipefail
          # Split on commas and spaces so the input can carry one login or
          # several. Matching stays exact per login: a substring match would
          # let "rubensgomes-bot" pass as "rubensgomes".
          IFS=', ' read -r -a allowed_actors <<< "$ALLOWED_ACTOR"
          permitted=0
          for login in "${allowed_actors[@]}"; do
            if [ "$ACTOR" = "$login" ]; then
              permitted=1
              break
            fi
          done
          if [ "$permitted" -ne 1 ]; then
            echo "Denied: only '${ALLOWED_ACTOR}' may run this workflow." >&2
            echo "Actor: '${ACTOR}'." >&2
            exit 1
          fi
          echo "Safeguard passed. Target repository: ${REPOSITORY}"

      - name: Sign in to Azure
        uses: rubensgomes-org/azure-workflows/.github/actions/azure-login@v0
        with:
          client-id: ${{ inputs.azure-client-id }}
          client-secret: ${{ secrets.azure-client-secret }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      # A missing registry is NOT an error here. A repository cannot outlive
      # the registry that held it, so "delete this repository" is already
      # satisfied and the run reports "nothing to delete" and succeeds. This
      # mirrors the repository-level check below, which has always treated an
      # absent repository as success.
      - name: Check whether the registry exists
        id: registry
        shell: bash
        run: |
          echo "=============================================================="
          echo " STEP: Check whether the registry exists"
          echo " az acr list"
          echo "=============================================================="
          set -euo pipefail
          if ! registries="$(az acr list --query '[].name' -o tsv)"; then
            echo "Could not list the registries in this subscription." >&2
            echo "That is a subscription-level failure -- a network or" >&2
            echo "token problem, or a principal without read access -- and" >&2
            echo "NOT a missing registry. Nothing was deleted." >&2
            exit 1
          fi
          # -i: ACR names are case-insensitive in Azure, and "az acr list"
          # returns the canonical casing. Matching case-sensitively would
          # report a differently-cased name as absent and exit 0, which is
          # the silent no-op this step exists to prevent.
          if ! printf '%s\n' "$registries" | grep -Fxqi "$ACR_NAME"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No registry named '${ACR_NAME}' in this subscription."
            echo "Nothing to delete; the remaining steps are skipped."
            exit 0
          fi
          login_server="$(az acr show --name "$ACR_NAME" \
                            --query loginServer -o tsv)"
          if [ -z "$login_server" ]; then
            echo "Registry '${ACR_NAME}' returned an empty loginServer." >&2
            exit 1
          fi
          echo "exists=true"                  >> "$GITHUB_OUTPUT"
          echo "login-server=${login_server}" >> "$GITHUB_OUTPUT"
          echo "Registry ${ACR_NAME} exists; login server is ${login_server}"

      # Deliberately "az acr repository list" and not "show": "show" cannot
      # distinguish "absent" from "the registry could not be reached", so a
      # transient outage would look like a successful no-op and the run would
      # go green having deleted nothing.
      - name: Check whether the repository exists
        id: exists
        if: steps.registry.outputs.exists == 'true'
        shell: bash
        env:
          REPOSITORY: ${{ steps.repo.outputs.repository }}
        run: |
          echo "=============================================================="
          echo " STEP: Check whether the repository exists"
          echo " az acr repository list --name ${ACR_NAME}"
          echo "=============================================================="
          set -euo pipefail
          if ! repositories="$(az acr repository list --name "$ACR_NAME" \
                                 -o tsv)"; then
            echo "Could not list the repositories in '${ACR_NAME}'." >&2
            echo "That is a registry-level failure -- a network or token" >&2
            echo "problem, or a principal without read access -- and NOT a" >&2
            echo "missing repository. Nothing was deleted." >&2
            exit 1
          fi
          # -F -x: whole line, literal. A substring match would let
          # "lab/azure-acr" be satisfied by "lab/azure-acr-legacy".
          if ! printf '%s\n' "$repositories" | grep -Fxq "$REPOSITORY"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Repository '${REPOSITORY}' is not in ${ACR_NAME}."
            echo "Nothing to delete; the delete step will be skipped."
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Repository '${REPOSITORY}' exists. These tags will be"
          echo "PERMANENTLY deleted along with it:"
          tags="$(az acr repository show-tags --name "$ACR_NAME" \
                    --repository "$REPOSITORY" -o tsv 2>/dev/null || true)"
          if [ -z "$tags" ]; then
            echo "  <untagged manifests only>"
          else
            # sed, not ${var//}, because this indents EVERY line.
            # shellcheck disable=SC2001
            echo "$tags" | sed 's/^/  /'
          fi

      - name: Delete the repository
        if: steps.exists.outputs.exists == 'true'
        shell: bash
        env:
          REPOSITORY: ${{ steps.repo.outputs.repository }}
        run: |
          echo "=============================================================="
          echo " STEP: Delete the repository"
          echo " az acr repository delete --name ${ACR_NAME}" \
               "--repository ${REPOSITORY}"
          echo "=============================================================="
          set -euo pipefail
          az acr repository delete \
            --name "$ACR_NAME" \
            --repository "$REPOSITORY" \
            --yes

      # Reads the catalog back: a delete that reported success but left the
      # repository behind must fail the run, not pass it.
      - name: Report the outcome
        shell: bash
        env:
          REPOSITORY: ${{ steps.repo.outputs.repository }}
          EXISTED: ${{ steps.exists.outputs.exists }}
          REGISTRY_EXISTED: ${{ steps.registry.outputs.exists }}
          ACR_LOGIN_SERVER: ${{ steps.registry.outputs.login-server }}
        run: |
          echo "=============================================================="
          echo " STEP: Report the outcome"
          echo "=============================================================="
          set -euo pipefail
          if [ "$REGISTRY_EXISTED" != "true" ]; then
            echo "Nothing was deleted."
            echo "  Registry:   ${ACR_NAME} -- not present"
            echo "  Repository: ${REPOSITORY} -- cannot exist without it"
            exit 0
          fi
          if [ "$EXISTED" != "true" ]; then
            echo "Nothing was deleted."
            echo "  Registry:   ${ACR_NAME} (${ACR_LOGIN_SERVER})"
            echo "  Repository: ${REPOSITORY} -- not present"
            exit 0
          fi
          if ! repositories="$(az acr repository list --name "$ACR_NAME" \
                                 -o tsv)"; then
            echo "Deleted '${REPOSITORY}', but the catalog could not be read" \
              >&2
            echo "back to confirm it. Re-run to verify." >&2
            exit 1
          fi
          if printf '%s\n' "$repositories" | grep -Fxq "$REPOSITORY"; then
            echo "Repository '${REPOSITORY}' is STILL in ${ACR_NAME}." >&2
            echo "The delete step reported success, so it did not take" \
                 "effect." >&2
            exit 1
          fi
          echo "Deleted."
          echo "  Registry:   ${ACR_NAME} (${ACR_LOGIN_SERVER})"
          echo "  Repository: ${REPOSITORY} -- gone, with all of its tags" \
               "and manifests"
