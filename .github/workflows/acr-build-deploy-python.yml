# =============================================================================
# acr-build-deploy-python
#
# Reusable workflow: build a Python/Poetry application, then publish its
# container image to an EXISTING Azure Container Registry via the
# publish-acr-image composite action.
#
# This workflow never CREATES a registry. Provisioning lives in
# rubensgomes-org/azure-iac.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: acr-build-deploy-python

on:
  workflow_call:
    inputs:
      environment:
        description: >-
          Image namespace, used as <environment>/<artifactId>:<tag>.
        required: true
        type: string
      tag:
        description: >-
          Image tag. Empty defaults to the application version.
        required: false
        default: ''
        type: string
      registry-name:
        description: >-
          Name of the EXISTING Azure Container Registry to push to (not the
          login server).
        required: true
        type: string
      artifact-id:
        description: 'Artifact ID used as the image repository name.'
        required: true
        type: string
      python-version:
        description: 'Python language version. Must match the consumer pin.'
        required: false
        default: '3.14'
        type: string
      poetry-version:
        description: 'Poetry version. Must match the consumer pin.'
        required: false
        default: '2.4.3'
        type: string
      timeout-minutes:
        description: 'Job timeout in minutes.'
        required: false
        default: 45
        type: number
      azure-client-id:
        description: 'Service principal application (client) ID.'
        required: true
        type: string
      azure-tenant-id:
        description: 'Entra ID tenant ID.'
        required: true
        type: string
      azure-subscription-id:
        description: 'Subscription holding the registry.'
        required: true
        type: string

    secrets:
      azure-client-secret:
        description: 'Service principal client secret.'
        required: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      # Checks out the CALLING repository, not azure-workflows.
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python and Poetry
        uses: rubensgomes-org/azure-workflows/.github/actions/setup-python-poetry@v0
        with:
          python-version: ${{ inputs.python-version }}
          poetry-version: ${{ inputs.poetry-version }}

      - name: Install tools and dependencies
        shell: bash
        run: |
          echo "=============================================================="
          echo " STEP: Install tools and dependencies"
          echo "=============================================================="
          poetry --no-cache -v install

      - name: Build
        uses: rubensgomes-org/azure-workflows/.github/actions/poetry-build@v0

      - name: Resolve the application version
        id: version
        shell: bash
        run: |
          echo "=============================================================="
          echo " STEP: Resolve the application version"
          echo "=============================================================="
          set -euo pipefail
          app_version="$(poetry version -s)"
          if [ -z "$app_version" ]; then
            echo "poetry version -s returned an empty version." >&2
            exit 1
          fi
          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "Application version: ${app_version}"

      - name: Publish the image to ACR
        uses: rubensgomes-org/azure-workflows/.github/actions/publish-acr-image@v0
        with:
          azure-client-id: ${{ inputs.azure-client-id }}
          azure-client-secret: ${{ secrets.azure-client-secret }}
          azure-tenant-id: ${{ inputs.azure-tenant-id }}
          azure-subscription-id: ${{ inputs.azure-subscription-id }}
          registry-name: ${{ inputs.registry-name }}
          artifact-id: ${{ inputs.artifact-id }}
          environment: ${{ inputs.environment }}
          tag: ${{ inputs.tag }}
          app-version: ${{ steps.version.outputs.app_version }}
